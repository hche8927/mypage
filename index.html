<!DOCTYPE html>

<html lang="en">
    <head>

        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
        <title>Haodong Chen</title>
        <meta name="description" content="Haodong (Tom) Chen - Machine Learning Engineer and Researcher.">

        <link rel="icon"
            href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 448 512'><path fill='white' d='M384 32c35.3 0 64 28.7 64 64V416c0 35.3-28.7 64-64 64H64c-35.3 0-64-28.7-64-64V96C0 60.7 28.7 32 64 32H384zM160 144c-13.3 0-24 10.7-24 24V344c0 13.3 10.7 24 24 24s24-10.7 24-24V280h80v64c0 13.3 10.7 24 24 24s24-10.7 24-24V168c0-13.3-10.7-24-24-24s-24 10.7-24 24v64H184V168c0-13.3-10.7-24-24-24z'/></svg>" />

        <link rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
            integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
            crossorigin="anonymous" referrerpolicy="no-referrer" />
        <link
            href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;700&display=swap"
            rel="stylesheet">
        <link rel="stylesheet" href="css/styles.css?v=9">

        <script>
            // Apply saved theme before paint to avoid flash
            (function () {
                let theme = 'light';
                try { theme = localStorage.getItem('theme') || 'light'; } catch (e) {}
                document.documentElement.setAttribute('data-theme', theme);
            })();
        </script>
    </head>

    <body>

        <main class="stage">
            <!-- 90 x 55 mm card (shown at 2x). js/card.js sets data-orient and --scale. -->
            <div class="card-scene" id="scene" data-orient="landscape">
                <div class="card" id="card">

                    <section class="face" aria-label="Business card">
                        <button class="theme-toggle" type="button" aria-label="Toggle dark mode">
                            <!-- Theme icon: "Half" by Freepik, flaticon.com/free-icon/half_3342251 (CC 3.0) -->
                            <img class="theme-icon" src="assets/theme-toggle.png" alt="" aria-hidden="true">
                        </button>

                        <div class="id-block">
                            <h1 class="name">Haodong (Tom) Chen</h1>
                            <p class="role">Machine Learning Engineer &amp; Researcher</p>
                            <p class="focus">Computer Vision · 3D · Generative AI · Agentic AI</p>
                        </div>

                        <div class="social-links">
                            <a href="https://www.linkedin.com/in/haodong-tom-chen/"
                               target="_blank" rel="noopener" aria-label="LinkedIn">
                                <i class="fa-brands fa-linkedin" aria-hidden="true"></i>
                            </a>
                            <a href="https://github.com/hche8927"
                               target="_blank" rel="noopener" aria-label="GitHub">
                                <i class="fa-brands fa-github" aria-hidden="true"></i>
                            </a>
                            <a href="https://scholar.google.com/citations?user=uAa5nxsAAAAJ&hl=en"
                               target="_blank" rel="noopener" aria-label="Google Scholar">
                                <i class="fa-solid fa-graduation-cap" aria-hidden="true"></i>
                            </a>
                            <a href="https://www.imdb.com/name/nm18435168/"
                               target="_blank" rel="noopener" aria-label="IMDb">
                                <img src="imdb.svg" alt="">
                            </a>
                        </div>

                        <a class="qr" href="https://haodong.page" target="_blank" rel="noopener"
                           aria-label="QR code linking to haodong.page">
                            <span class="qr-inner" id="qr"></span>
                        </a>
                    </section>

                </div>
            </div>
        </main>

        <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
        <script src="js/card.js?v=9"></script>
        <script src="js/theme.js?v=9"></script>
    </body>
</html>
